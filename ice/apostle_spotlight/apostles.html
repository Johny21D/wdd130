<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        /* Insert styles here */
.Jesus-Christ {
    width: 1200px;
    height: 750px;
    border: 10px black;
    border-radius: 60px;
    display: block;
    margin-left: 150px;   /* moves Jesus image to the right */
}

/* Elder Oaks */
.elder-oaks {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid #ffd783;
    position: absolute;
    top: 100px;    /* adjust manually to align with Jesus */
    left: 200px;   /* adjust manually to align with Jesus */
}
.elder-oaks img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 30%;
    display: block;
}

/* Elder Eyring */
.elder-eyring {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid #ffd783;
    position: absolute;
    top: 100px;    /* same as Oaks */
    left: 400px;   /* adjust to the right */
}
.elder-eyring img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 30%;
    display: block;
}


    </style>
</head>
<body>
    <img src="images/christus.webp" alt="Jesus Christ" class="Jesus-Christ">


<div class="elder-oaks">
    <img src="images/oaks.webp" alt="Elder Oaks">
</div>


<div class="elder-eyring">
    <img src="images/eyring.webp" alt="Elder Eyring">
</div>


</body>
</html
